<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高分推荐 - 阿尔法策略2.0系统</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css?v=20251118020">
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header .header-left {
            margin-left: 0;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            gap: 10px;
            flex: 0 0 auto;
        }

        .back-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .header-center h1 {
            margin: 0;
            font-size: 24px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        .status-indicator.scanning {
            background: #ff9800;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 20px;
        }

        .control-panel {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .control-row {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .refresh-btn {
            padding: 10px 20px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .refresh-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-info {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
            font-size: 14px;
        }

        .status-info .countdown {
            font-weight: bold;
            color: #667eea;
        }

        .ranking-table-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .ranking-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ranking-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .ranking-table {
            width: 100%;
            border-collapse: collapse;
        }

        .ranking-table thead {
            background: #f8f9fa;
        }

        .ranking-table th {
            padding: 15px;
            text-align: left;
            font-weight: bold;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }

        .ranking-table td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .volume-type-cell,
        .date-cell {
            color: #000;
        }

        .ranking-table tbody tr:hover {
            background: #f9f9f9;
        }

        .rank-cell {
            font-weight: bold;
            font-size: 18px;
            color: #667eea;
            text-align: center;
            width: 60px;
        }

        .rank-cell.top1 {
            color: #ffd700;
            font-size: 22px;
        }

        .rank-cell.top2 {
            color: #c0c0c0;
            font-size: 20px;
        }

        .rank-cell.top3 {
            color: #cd7f32;
            font-size: 20px;
        }

        .stock-code-cell {
            font-weight: bold;
            color: #333;
        }

        .stock-name-cell {
            color: #666;
        }

        .score-cell {
            font-weight: bold;
            font-size: 16px;
        }

        .score-strategy1 {
            color: #4caf50;
        }

        .score-strategy2 {
            color: #ff9800;
        }

        .score-total {
            color: #e91e63;
            font-size: 20px;
            font-weight: bold;
        }

        .change-cell {
            font-weight: bold;
        }

        .change-cell.change-up {
            color: #d32f2f;
        }

        .change-cell.change-down {
            color: #2e7d32;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 5px;
        }

        .badge-triggered {
            background: #4caf50;
            color: white;
        }

        .badge-not-triggered {
            background: #e0e0e0;
            color: #666;
        }

        .nature-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            background: #e3f2fd;
            color: #1976d2;
        }

        .nature-badge.短线 {
            background: #fff3e0;
            color: #e65100;
        }

        .nature-badge.中长线 {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #999;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .summary-info {
            background: #f8f9fa;
            padding: 15px 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #666;
            font-size: 14px;
        }

        .nature-sections {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .nature-section {
            border-top: 1px solid #f0f0f0;
        }

        .nature-header {
            background: #f4f5fb;
            color: #333;
        }

        .nature-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nature-count {
            font-weight: bold;
            color: #667eea;
        }

        .nature-summary {
            justify-content: flex-start;
            gap: 20px;
        }

        .nature-empty {
            padding: 30px 0;
        }


        .scan-stats {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #888;
        }

        .scan-stats span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .trading-status {
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .trading-status.trading {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .trading-status.closed {
            background: #fce4ec;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="header-left">
                <a href="/" class="back-btn">← 返回首页</a>
                <a href="/config.html" class="back-btn">🎛️ 调参平台</a>
            </div>
            <div class="header-center">
                <h1>⭐ <span style="color: #ff4444;">盘中高分推荐</span></h1>
            </div>
            <div class="header-right">
                <div class="status-indicator" id="status-indicator"></div>
                <span id="status-text">准备中...</span>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 控制面板 -->
        <div class="control-panel">
            <div class="control-row">
                <button class="refresh-btn" onclick="manualRefresh()" id="refresh-btn">
                    🔄 手动刷新
                </button>
                <div class="status-info">
                    <span id="update-time" style="font-size: 12px; opacity: 0.8;"></span>
                </div>
            </div>
        </div>

        <!-- 盘中高分推荐 -->
        <div class="ranking-table-container">
            <div class="ranking-header">
                <h2>⚡ 盘中高分推荐</h2>
                <div style="font-size: 14px; opacity: 0.9;">
                    <span id="total-count">共 0 只股票达到阈值</span>
                </div>
            </div>

            <div id="ranking-content">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <div>正在加载高分推荐...</div>
                    <div style="font-size: 12px; color: #aaa; margin-top: 10px;">实时更新</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api';
        let isScanning = false;
        const DEFAULT_NATURE = '波段';
        const NATURE_GROUPS = [
            { key: '短线', label: '短线高分推荐' },
            { key: '波段', label: '波段高分推荐' },
            { key: '中长线', label: '中长线高分推荐' },
        ];


        function formatTodayDigits() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}${m}${d}`;
        }

        function normalizeDateDigits(val) {
            if (!val) return null;
            const digits = String(val).replace(/[^0-9]/g, '');
            if (digits.length >= 8) {
                return digits.slice(0, 8);
            }
            return null;
        }

        // 扫描高分股票（使用快速查询接口，毫秒级）
        async function scanHighScoreStocks(useCache = true) {
            if (isScanning) {
                console.log('正在查询中，跳过...');
                return;
            }

            isScanning = true;
            updateScanningStatus(true);

            try {
                // 使用分组接口（从Redis读取，并按股性分别取Top N）
                const todayDigits = formatTodayDigits();
                const response = await fetch(`${API_BASE_URL}/streaming/high_score/grouped`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        limit_per_group: 100,
                        scan_limit: 5000,
                        date: todayDigits
                    })
                });

                const result = await response.json();

                if (result.code === 200 && result.data) {
                    const groups = result.data.groups || {};
                    const filteredGroups = {};
                    let total = 0;
                    NATURE_GROUPS.forEach(g => {
                        const arr = groups[g.key] || [];
                        const filteredArr = arr.filter(item => {
                            const digits = normalizeDateDigits(item.date);
                            return digits === todayDigits;
                        });
                        filteredGroups[g.key] = filteredArr;
                        total += filteredArr.length;
                    });

                    const filteredData = {
                        ...result.data,
                        groups: filteredGroups,
                        total: total,
                        total_by_nature: {
                            '短线': filteredGroups['短线']?.length || 0,
                            '波段': filteredGroups['波段']?.length || 0,
                            '中长线': filteredGroups['中长线']?.length || 0,
                        }
                    };

                    displayRanking(filteredData);
                    
                    // 显示流式服务统计信息
                    const stats = result.data.service_stats;
                    if (stats && stats.last_round_time) {
                        document.getElementById('update-time').textContent = 
                            `数据更新: ${stats.last_round_time} | 已完成 ${stats.total_rounds} 轮`;
                    } else {
                        document.getElementById('update-time').textContent = 
                            `更新时间: ${new Date().toLocaleTimeString('zh-CN')}`;
                    }
                    
                    document.getElementById('status-text').textContent = '已更新';
                } else {
                    document.getElementById('ranking-content').innerHTML = 
                        '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div>查询失败，请稍后重试</div></div>';
                    document.getElementById('status-text').textContent = '查询失败';
                }
            } catch (error) {
                console.error('扫描高分股票失败:', error);
                document.getElementById('ranking-content').innerHTML = 
                    '<div class="empty-state"><div class="empty-state-icon">❌</div><div>网络错误，请检查连接</div></div>';
                document.getElementById('status-text').textContent = '网络错误';
            } finally {
                isScanning = false;
                updateScanningStatus(false);
            }
        }

        // 更新扫描状态
        function updateScanningStatus(scanning) {
            const indicator = document.getElementById('status-indicator');
            const refreshBtn = document.getElementById('refresh-btn');
            
            if (scanning) {
                indicator.classList.add('scanning');
                refreshBtn.disabled = true;
                refreshBtn.textContent = '⏳ 查询中...';
                document.getElementById('status-text').textContent = '正在查询...';
            } else {
                indicator.classList.remove('scanning');
                refreshBtn.disabled = false;
                refreshBtn.textContent = '🔄 手动刷新';
            }
        }

        // 显示排行榜
        function displayRanking(data) {
            const hasGrouped = !!data.groups;
            const stocks = data.stocks || [];

            let natureGroups = null;
            if (hasGrouped) {
                natureGroups = {
                    '短线': data.groups['短线'] || [],
                    '波段': data.groups['波段'] || [],
                    '中长线': data.groups['中长线'] || [],
                };
            } else {
                natureGroups = groupByNature(stocks);
            }

            const totalCount = (data.total != null) ? data.total : (
                (natureGroups['短线'].length || 0) + (natureGroups['波段'].length || 0) + (natureGroups['中长线'].length || 0)
            );

            if (totalCount === 0) {
                document.getElementById('ranking-content').innerHTML = 
                    `<div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <div>暂无达到阈值的高分股票</div>
                    </div>`;
                document.getElementById('total-count').textContent = '共 0 只股票达到阈值';
                return;
            }

            const groupSummaryText = NATURE_GROUPS
                .map(group => `${group.key} ${natureGroups[group.key].length} 只`)
                .join(' / ');
            document.getElementById('total-count').textContent = 
                `共 ${totalCount} 只（${groupSummaryText}，仅展示今日数据）`;

            let html = '<div class="nature-sections">';
            NATURE_GROUPS.forEach(group => {
                html += renderNatureSection(group, natureGroups[group.key]);
            });
            html += '</div>';

            document.getElementById('ranking-content').innerHTML = html;
        }

        // 手动刷新（不使用缓存）
        function manualRefresh() {
            scanHighScoreStocks(false);  // 不使用缓存
        }

        // 打开股票详情
        function openStock(stockCode, stockName, tableName) {
            const url = `/?stock=${encodeURIComponent(stockCode)}&name=${encodeURIComponent(stockName)}&table=${encodeURIComponent(tableName)}`;
            window.open(url, '_blank');
        }

        // 初始化加载（仅加载一次，不自动轮询）
        function initPage() {
            scanHighScoreStocks();  // 直接查询数据库
        }

        function groupByNature(stocks) {
            const groups = {
                '短线': [],
                '波段': [],
                '中长线': [],
            };

            stocks.forEach(item => {
                const nature = normalizeNature(item.nature);
                groups[nature].push({ ...item, nature });
            });

            Object.keys(groups).forEach(key => {
                groups[key].sort((a, b) => (b.total_score || 0) - (a.total_score || 0));
            });
            return groups;
        }

        function normalizeNature(rawNature) {
            const val = (rawNature || '').trim();
            if (!val) return DEFAULT_NATURE;
            if (val === '短线' || val === '波段' || val === '中长线') return val;
            return DEFAULT_NATURE;
        }

        function renderNatureSection(group, items = []) {
            const hasData = items.length > 0;
            const header = `
                <div class="ranking-header nature-header">
                    <div class="nature-title">
                        <h3 style="margin: 0;">${group.label}</h3>
                        <span class="nature-badge ${group.key}">${group.key}</span>
                    </div>
                    <div class="nature-count">${hasData ? `${items.length} 只` : '暂无'}</div>
                </div>
            `;

            if (!hasData) {
                return `
                    <div class="nature-section">
                        ${header}
                        <div class="empty-state nature-empty">
                            <div class="empty-state-icon">📊</div>
                            <div>当前股性暂无高分股票</div>
                        </div>
                    </div>
                `;
            }

            const rowsHtml = items.map((item, index) => {
                const rank = index + 1;
                let rankClass = '';
                let rankIcon = rank;

                if (rank === 1) {
                    rankClass = 'top1';
                    rankIcon = '🥇';
                } else if (rank === 2) {
                    rankClass = 'top2';
                    rankIcon = '🥈';
                } else if (rank === 3) {
                    rankClass = 'top3';
                    rankIcon = '🥉';
                }

                const normalizedNature = normalizeNature(item.nature);
                const natureClass = normalizedNature;

                // 当日涨跌幅（%）：盘中实时=最新价(1分钟聚合close)相对昨收
                const changePct = (item.today_change_pct === null || item.today_change_pct === undefined)
                    ? null
                    : Number(item.today_change_pct);
                const changeText = (changePct === null || Number.isNaN(changePct))
                    ? '-'
                    : `${changePct >= 0 ? '+' : ''}${changePct.toFixed(2)}%`;
                const changeClass = (changePct === null || Number.isNaN(changePct))
                    ? ''
                    : (changePct >= 0 ? 'change-up' : 'change-down');

                return `
                    <tr>
                        <td class="rank-cell ${rankClass}">${rankIcon}</td>
                        <td class="stock-code-cell">${item.stock_code}</td>
                        <td class="stock-name-cell">${item.stock_name}</td>
                        <td class="score-cell score-total">${item.total_score.toFixed(1)}%</td>
                        <td class="change-cell ${changeClass}">${changeText}</td>
                        <td class="score-cell score-strategy1">
                            ${item.strategy1_score.toFixed(1)}
                            ${item.strategy1_triggered ? '<span class="badge badge-triggered">✓</span>' : ''}
                        </td>
                        <td class="score-cell score-strategy2">
                            ${item.strategy2_score.toFixed(1)}
                            ${item.strategy2_triggered ? '<span class="badge badge-triggered">✓</span>' : ''}
                        </td>
                        <td class="volume-type-cell">${item.volume_type || '-'}</td>
                        <td><span class="nature-badge ${natureClass}">${normalizedNature}</span></td>
                        <td class="date-cell">${item.date || '-'}</td>
                    </tr>
                `;
            }).join('');

            return `
                <div class="nature-section">
                    ${header}
                    <table class="ranking-table">
                        <thead>
                            <tr>
                                <th style="width: 60px; text-align: center;">排名</th>
                                <th style="width: 120px;">股票代码</th>
                                <th style="width: 120px;">股票名称</th>
                                <th style="width: 100px;">总评分</th>
                                <th style="width: 110px;">当日涨跌幅</th>
                                <th style="width: 100px;">策略1</th>
                                <th style="width: 100px;">策略2</th>
                                <th style="width: 100px;">成交量类型</th>
                                <th style="width: 80px;">股性</th>
                                <th style="width: 110px;">日期</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>
                    <div class="summary-info nature-summary">
                        <div>共找到 <strong>${items.length}</strong> 只 ${group.key} 股性的高分股票</div>
                        <div class="scan-stats">
                            <span>📊 当前股性: ${items.length} 只</span>
                            <span>⚡ 实时更新</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // 页面加载时启动
        window.onload = () => {
            initPage();
        };
    </script>
</body>
</html>
