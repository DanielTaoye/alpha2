<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高分推荐 - 阿尔法策略2.0系统</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css?v=20251118020">
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header .header-left {
            margin-left: 0;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            gap: 10px;
            flex: 0 0 auto;
        }

        .back-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .header-center h1 {
            margin: 0;
            font-size: 24px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        .status-indicator.scanning {
            background: #ff9800;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 20px;
        }

        .control-panel {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .control-row {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .refresh-btn {
            padding: 10px 20px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .refresh-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-info {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
            font-size: 14px;
        }

        .status-info .countdown {
            font-weight: bold;
            color: #667eea;
        }

        .ranking-table-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .ranking-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ranking-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .ranking-table {
            width: 100%;
            border-collapse: collapse;
        }

        .ranking-table thead {
            background: #f8f9fa;
        }

        .ranking-table th {
            padding: 15px;
            text-align: left;
            font-weight: bold;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }

        .ranking-table td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .volume-type-cell,
        .date-cell {
            color: #000;
        }

        .ranking-table tbody tr:hover {
            background: #f9f9f9;
        }

        .rank-cell {
            font-weight: bold;
            font-size: 18px;
            color: #667eea;
            text-align: center;
            width: 60px;
        }

        .rank-cell.top1 {
            color: #ffd700;
            font-size: 22px;
        }

        .rank-cell.top2 {
            color: #c0c0c0;
            font-size: 20px;
        }

        .rank-cell.top3 {
            color: #cd7f32;
            font-size: 20px;
        }

        .stock-code-cell {
            font-weight: bold;
            color: #333;
        }

        .stock-name-cell {
            color: #666;
        }

        .score-cell {
            font-weight: bold;
            font-size: 16px;
        }

        .score-strategy1 {
            color: #4caf50;
        }

        .score-strategy2 {
            color: #ff9800;
        }

        .score-total {
            color: #e91e63;
            font-size: 20px;
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 5px;
        }

        .badge-triggered {
            background: #4caf50;
            color: white;
        }

        .badge-not-triggered {
            background: #e0e0e0;
            color: #666;
        }

        .nature-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            background: #e3f2fd;
            color: #1976d2;
        }

        .nature-badge.短线 {
            background: #fff3e0;
            color: #e65100;
        }

        .nature-badge.中长线 {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #999;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .summary-info {
            background: #f8f9fa;
            padding: 15px 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #666;
            font-size: 14px;
        }

        .clickable-row {
            cursor: pointer;
        }

        .clickable-row:hover {
            background: #f0f7ff !important;
        }

        .scan-stats {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #888;
        }

        .scan-stats span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .trading-status {
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .trading-status.trading {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .trading-status.closed {
            background: #fce4ec;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="header-left">
                <a href="/" class="back-btn">← 返回首页</a>
                <a href="/config.html" class="back-btn">🎛️ 调参平台</a>
            </div>
            <div class="header-center">
                <h1>⭐ <span style="color: #ff4444;">盘中高分推荐</span></h1>
            </div>
            <div class="header-right">
                <div class="status-indicator" id="status-indicator"></div>
                <span id="status-text">准备中...</span>
                <span id="trading-status" class="trading-status closed">非交易时段</span>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 控制面板 -->
        <div class="control-panel">
            <div class="control-row">
                <button class="refresh-btn" onclick="manualRefresh()" id="refresh-btn">
                    🔄 手动刷新
                </button>
                <div class="status-info">
                    <span>🔄 自动刷新: 每 <span class="countdown" id="countdown">60</span> 秒</span>
                    <span id="update-time" style="font-size: 12px; opacity: 0.8;"></span>
                </div>
            </div>
        </div>

        <!-- 盘中高分推荐 -->
        <div class="ranking-table-container">
            <div class="ranking-header">
                <h2>⚡ 盘中高分推荐</h2>
                <div style="font-size: 14px; opacity: 0.9;">
                    <span id="total-count">共 0 只股票达到阈值</span>
                </div>
            </div>

            <div id="ranking-content">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <div>正在加载高分推荐...</div>
                    <div style="font-size: 12px; color: #aaa; margin-top: 10px;">实时更新</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api';
        let refreshInterval = null;
        let countdownInterval = null;
        let countdownValue = 60;
        let isScanning = false;

        // 检查交易状态
        async function checkTradingStatus() {
            try {
                const response = await fetch(`${API_BASE_URL}/trading_status`);
                const result = await response.json();
                
                if (result.code === 0 && result.data) {
                    const statusEl = document.getElementById('trading-status');
                    if (result.data.is_trading_time) {
                        statusEl.textContent = '交易时段';
                        statusEl.className = 'trading-status trading';
                    } else {
                        statusEl.textContent = '非交易时段';
                        statusEl.className = 'trading-status closed';
                    }
                }
            } catch (error) {
                console.error('检查交易状态失败:', error);
            }
        }

        // 扫描高分股票（使用快速查询接口，毫秒级）
        async function scanHighScoreStocks(useCache = true) {
            if (isScanning) {
                console.log('正在查询中，跳过...');
                return;
            }

            isScanning = true;
            updateScanningStatus(true);

            try {
                // 使用快速接口（直接查数据库，毫秒级）
                const response = await fetch(`${API_BASE_URL}/streaming/high_score`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        limit: 100
                    })
                });

                const result = await response.json();

                if (result.code === 200 && result.data) {
                    displayRanking(result.data);
                    document.getElementById('total-count').textContent = 
                        `共 ${result.data.total || 0} 只股票达到阈值`;
                    
                    // 显示流式服务统计信息
                    const stats = result.data.service_stats;
                    if (stats && stats.last_round_time) {
                        document.getElementById('update-time').textContent = 
                            `数据更新: ${stats.last_round_time} | 已完成 ${stats.total_rounds} 轮`;
                    } else {
                        document.getElementById('update-time').textContent = 
                            `更新时间: ${new Date().toLocaleTimeString('zh-CN')}`;
                    }
                    
                    document.getElementById('status-text').textContent = '实时数据';
                } else {
                    document.getElementById('ranking-content').innerHTML = 
                        '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div>查询失败，请稍后重试</div></div>';
                    document.getElementById('status-text').textContent = '查询失败';
                }
            } catch (error) {
                console.error('扫描高分股票失败:', error);
                document.getElementById('ranking-content').innerHTML = 
                    '<div class="empty-state"><div class="empty-state-icon">❌</div><div>网络错误，请检查连接</div></div>';
                document.getElementById('status-text').textContent = '网络错误';
            } finally {
                isScanning = false;
                updateScanningStatus(false);
            }
        }

        // 更新扫描状态
        function updateScanningStatus(scanning) {
            const indicator = document.getElementById('status-indicator');
            const refreshBtn = document.getElementById('refresh-btn');
            
            if (scanning) {
                indicator.classList.add('scanning');
                refreshBtn.disabled = true;
                refreshBtn.textContent = '⏳ 查询中...';
                document.getElementById('status-text').textContent = '正在查询...';
            } else {
                indicator.classList.remove('scanning');
                refreshBtn.disabled = false;
                refreshBtn.textContent = '🔄 手动刷新';
            }
        }

        // 显示排行榜
        function displayRanking(data) {
            const stocks = data.stocks || [];
            
            if (stocks.length === 0) {
                document.getElementById('ranking-content').innerHTML = 
                    `<div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <div>暂无达到阈值的高分股票</div>
                    </div>`;
                return;
            }

            let html = `
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th style="width: 60px; text-align: center;">排名</th>
                            <th style="width: 120px;">股票代码</th>
                            <th style="width: 120px;">股票名称</th>
                            <th style="width: 100px;">总评分</th>
                            <th style="width: 100px;">策略1</th>
                            <th style="width: 100px;">策略2</th>
                            <th style="width: 100px;">成交量类型</th>
                            <th style="width: 80px;">股性</th>
                            <th style="width: 110px;">日期</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            stocks.forEach((item, index) => {
                const rank = index + 1;
                let rankClass = '';
                let rankIcon = rank;
                
                if (rank === 1) {
                    rankClass = 'top1';
                    rankIcon = '🥇';
                } else if (rank === 2) {
                    rankClass = 'top2';
                    rankIcon = '🥈';
                } else if (rank === 3) {
                    rankClass = 'top3';
                    rankIcon = '🥉';
                }

                const tableName = item.table_name || `basic_data_${item.stock_code.toLowerCase()}`;
                const natureClass = item.nature || '';
                
                html += `
                    <tr class="clickable-row" onclick="openStock('${item.stock_code}', '${item.stock_name}', '${tableName}')">
                        <td class="rank-cell ${rankClass}">${rankIcon}</td>
                        <td class="stock-code-cell">${item.stock_code}</td>
                        <td class="stock-name-cell">${item.stock_name}</td>
                        <td class="score-cell score-total">${item.total_score.toFixed(1)}%</td>
                        <td class="score-cell score-strategy1">
                            ${item.strategy1_score.toFixed(1)}
                            ${item.strategy1_triggered ? 
                                '<span class="badge badge-triggered">✓</span>' : ''}
                        </td>
                        <td class="score-cell score-strategy2">
                            ${item.strategy2_score.toFixed(1)}
                            ${item.strategy2_triggered ? 
                                '<span class="badge badge-triggered">✓</span>' : ''}
                        </td>
                        <td class="volume-type-cell">${item.volume_type || '-'}</td>
                        <td><span class="nature-badge ${natureClass}">${item.nature || '波段'}</span></td>
                        <td class="date-cell">${item.date || '-'}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
                <div class="summary-info">
                    <div>
                        共找到 <strong>${data.total || 0}</strong> 只达到阈值的高分股票
                    </div>
                    <div class="scan-stats">
                        <span>📊 总共: ${data.total || 0} 只</span>
                        <span>⚡ 实时更新</span>
                    </div>
                </div>
            `;

            document.getElementById('ranking-content').innerHTML = html;
        }

        // 手动刷新（不使用缓存）
        function manualRefresh() {
            countdownValue = 60;
            document.getElementById('countdown').textContent = countdownValue;
            scanHighScoreStocks(false);  // 不使用缓存
        }

        // 打开股票详情
        function openStock(stockCode, stockName, tableName) {
            const url = `/?stock=${encodeURIComponent(stockCode)}&name=${encodeURIComponent(stockName)}&table=${encodeURIComponent(tableName)}`;
            window.open(url, '_blank');
        }

        // 启动自动刷新
        function startAutoRefresh() {
            // 立即加载一次
            checkTradingStatus();
            scanHighScoreStocks();  // 直接查询数据库，毫秒级
            
            // 设置倒计时
            countdownInterval = setInterval(() => {
                countdownValue--;
                document.getElementById('countdown').textContent = countdownValue;
                
                if (countdownValue <= 0) {
                    countdownValue = 60;
                    scanHighScoreStocks();  // 自动刷新，直接查数据库
                    checkTradingStatus();
                }
            }, 1000);
        }

        // 停止自动刷新
        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
        }

        // 页面加载时启动
        window.onload = () => {
            startAutoRefresh();
        };

        // 页面卸载时停止
        window.onbeforeunload = () => {
            stopAutoRefresh();
        };
    </script>
</body>
</html>
