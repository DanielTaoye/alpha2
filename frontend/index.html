<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿尔法策略2.0系统 - 智能股票K线分析平台</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css?v=20251118020">
    <!-- ECharts 多CDN备份加载方案 -->
    <script>
        // ECharts CDN列表（按优先级排序：国内CDN优先）
        const echartsUrls = [
            'https://lib.baomitu.com/echarts/5.4.3/echarts.min.js',           // 国内：360前端静态资源库
            'https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js', // 国内：BootCDN
            'https://unpkg.com/echarts@5.4.3/dist/echarts.min.js',            // 国际：unpkg
            'https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js', // 国际：jsdelivr
            'https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js' // 国际：cloudflare
        ];

        let currentCdnIndex = 0;
        let loadStartTime = Date.now();
        const TIMEOUT_PER_CDN = 5000; // 每个CDN尝试超时时间（毫秒）
        window.echartsLoadStatus = 'loading'; // 全局加载状态

        function isValidECharts() {
            // 验证 ECharts 是否正确加载
            try {
                return typeof echarts !== 'undefined' 
                    && typeof echarts.init === 'function'
                    && typeof echarts.version === 'string';
            } catch (e) {
                return false;
            }
        }

        function loadECharts() {
            if (currentCdnIndex >= echartsUrls.length) {
                console.error('❌ 所有ECharts CDN都加载失败');
                window.echartsLoadStatus = 'failed';
                document.body.insertAdjacentHTML('afterbegin', 
                    '<div id="echarts-error-banner" style="background:#ff4444;color:white;padding:12px;text-align:center;font-size:14px;z-index:9999;position:relative;box-shadow:0 2px 8px rgba(0,0,0,0.2);">⚠️ ECharts库加载失败，图表功能不可用。<a href="javascript:location.reload()" style="color:white;text-decoration:underline;margin-left:10px;font-weight:bold;">🔄 刷新页面</a></div>'
                );
                return;
            }

            console.log(`🔄 尝试加载 ECharts [${currentCdnIndex + 1}/${echartsUrls.length}]: ${echartsUrls[currentCdnIndex]}`);
            
            const script = document.createElement('script');
            script.src = echartsUrls[currentCdnIndex];
            let hasTimeout = false;
            
            // 设置超时定时器
            const timeoutId = setTimeout(() => {
                if (window.echartsLoadStatus === 'loading') {
                    hasTimeout = true;
                    console.warn(`⏱️ ECharts加载超时 (${TIMEOUT_PER_CDN}ms): ${echartsUrls[currentCdnIndex]}`);
                    script.onerror = null;
                    script.onload = null;
                    document.head.removeChild(script);
                    currentCdnIndex++;
                    loadECharts(); // 尝试下一个CDN
                }
            }, TIMEOUT_PER_CDN);
            
            script.onload = function() {
                if (hasTimeout) return; // 如果已超时，忽略
                
                clearTimeout(timeoutId);
                
                // 验证 ECharts 是否真的可用
                setTimeout(() => {
                    if (isValidECharts()) {
                        const loadTime = Date.now() - loadStartTime;
                        console.log(`✅ ECharts加载并验证成功 (耗时${loadTime}ms): ${echartsUrls[currentCdnIndex]}`);
                        console.log(`📦 ECharts版本: ${echarts.version}`);
                        window.echartsLoadStatus = 'success';
                    } else {
                        console.warn(`⚠️ ECharts脚本加载但验证失败: ${echartsUrls[currentCdnIndex]}`);
                        window.echarts = undefined; // 清除无效对象
                        currentCdnIndex++;
                        loadECharts(); // 尝试下一个CDN
                    }
                }, 100);
            };
            
            script.onerror = function(e) {
                if (hasTimeout) return; // 如果已超时，忽略
                
                clearTimeout(timeoutId);
                console.warn(`❌ ECharts加载失败: ${echartsUrls[currentCdnIndex]}`, e);
                currentCdnIndex++;
                loadECharts(); // 尝试下一个CDN
            };
            
            document.head.appendChild(script);
        }

        // 立即开始加载
        loadECharts();
    </script>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <a href="/config.html" class="config-btn">
                🎛️ 调参平台
            </a>
            <a href="/batch_backtest.html" class="config-btn" style="margin-left: 10px;">
                📊 批量回测
            </a>
            <a href="/high_score.html" class="config-btn" style="margin-left: 10px; display: none;">
                ⭐ 高分推荐
            </a>
        </div>
        <div class="header-center">
            <h1>阿尔法策略2.0</h1>
        </div>
        <div class="header-right">
            <span class="status-indicator online" id="status-indicator"></span>
            <span id="status-text">运行中</span>
        </div>
    </div>

    <!-- 筛选区域 -->
    <div class="filter-container">
        <div class="filter-section">
            <label class="filter-label">📊 选择策略类型</label>
            <div class="strategy-buttons">
                <button class="strategy-btn active" onclick="selectStrategy('波段')">
                    📈 波段策略
                </button>
                <button class="strategy-btn" onclick="selectStrategy('短线')">
                    ⚡ 短线策略
                </button>
                <button class="strategy-btn" onclick="selectStrategy('中长线')">
                    📊 中长线策略
                </button>
            </div>
        </div>

        <div class="filter-section">
            <label class="filter-label">🔍 搜索并选择股票</label>
            <div class="search-box">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput"
                    placeholder="搜索全部股票（输入股票代码或名称）..."
                    oninput="filterStocks()"
                >
                <select class="stock-select" id="stockSelect" onchange="selectStock()">
                    <option value="">-- 请选择股票（或在上方搜索） --</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 主内容区 -->
    <div id="app">
        <div class="empty-state">
            <div class="empty-state-icon">📈</div>
            <div class="empty-state-text">请选择股票策略类型和具体股票</div>
        </div>
    </div>

    <div class="footer">
        <p>© 2025 阿尔法策略2.0系统 | 数据仅供参考，不构成投资建议</p>
        <p style="font-size: 12px; color: #666; margin-top: 10px;">
            投资有风险，入市需谨慎
        </p>
    </div>

    <script src="js/app.js?v=20251202160000"></script>
</body>
</html>
